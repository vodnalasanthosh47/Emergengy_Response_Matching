# CP1 local runtime (spec §7.1 F). Run via the Makefile: `make images && make up`.
#
# This file currently holds the storage tier only:
#     coordinator ──/internal/...──► storage-node ──driver──► mongo
# The application services, RabbitMQ and the nginx gateway (the only published port,
# 8080) are added here next.
#
# Written so that moving to Kubernetes in CP2 is mechanical: one process per
# container, all config from environment variables, health endpoints everywhere.

name: emergency

services:
  mongo:
    image: mongo:8.0
    # Standalone mongod — deliberately NO replica set or sharding: replication and
    # sharding are implemented by our own storage tier (spec decision 2.2-8).
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    # No "ports:" section, so MongoDB is not reachable from the host. It is attached
    # only to the internal "mongo" network, so only the storage node can reach it.
    networks: [mongo]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  storage-node:
    image: emergency/storage-node:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
      NODE_ID: node-0
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: storage
      # Tell the Go garbage collector about the container limit so it collects before
      # the kernel OOM-kills the process (Go does not read cgroup memory limits itself).
      GOMEMLIMIT: 48MiB
    networks: [mongo, storage]
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # Distroless has no curl, so the binary probes its own /readyz.
      test: ["CMD", "/storage-node", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s

  coordinator:
    image: emergency/coordinator:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
      STORAGE_NODE_URL: http://storage-node:8080
      STORAGE_TIMEOUT: 3s
      GOMEMLIMIT: 48MiB
    networks: [storage]
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      storage-node:
        condition: service_healthy
    healthcheck:
      # /readyz: "healthy" means the storage node behind it is reachable, so services
      # that depend on the coordinator start only once storage actually works.
      test: ["CMD", "/coordinator", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s

networks:
  # Mongo + storage node only. "internal" = no route to the outside world.
  mongo:
    internal: true
  # Storage node + coordinator (the application services will join the coordinator
  # on a separate network, so they can never reach a storage node directly).
  storage: {}

volumes:
  mongo-data: {}
