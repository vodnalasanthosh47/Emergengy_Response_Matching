# Local runtime (spec §7.1 F). Run via the Makefile:
#     make images && make up
#
#   client ──► gateway (nginx, the only published port: 8080)
#                 │ /requests                          │ /resources
#                 ▼                                    ▼
#             request-service ──publish──► rabbitmq   resource-service
#                 │ /v1/data            │ consume          │ /v1/data, /v1/query
#                 │                     ▼                  │
#                 │             matching-service (/match) ─┤ claims resources, marks requests
#                 ▼◄───────────────────────────────────────┘
#             coordinator ◄──register/heartbeat── storage-{0,1,2}-{a,b} ──driver──► mongo-{0,1,2}-{a,b}
#                         ──/internal/...──────►
#
#   3 shards × 2 storage nodes (one primary + one replica per shard), each node with its
#   own standalone MongoDB, plus one coordinator.
#
# Networks keep the layers apart: application services share "services" with the
# coordinator and RabbitMQ, and can never reach a storage node or MongoDB directly.
#
# Nodes register themselves with the coordinator, which elects each shard's primary,
# replicates writes to the replica, fails over when a node stops heartbeating and
# resyncs it when it comes back. Demo a failure with:
#     docker compose -p emergency stop storage-1-a   …   docker compose -p emergency start storage-1-a
#
# Written so that moving to Kubernetes is mechanical: one process per container, all
# config from environment variables, health endpoints everywhere.

name: emergency

# MongoDB 7.0, not 8.x: MongoDB 8 refuses to start on Linux kernels 6.19.0–7.0.13
# (SERVER-121912). We use only features 7.0 has.
x-mongo: &mongo
  image: mongo:7.0
  # Standalone mongod — deliberately NO replica set or sharding: replication and
  # sharding are implemented by our own storage tier (ADR 0008).
  command: ["--wiredTigerCacheSizeGB", "0.25"]
  # No "ports:" section and only the internal "mongo" network: only storage nodes
  # can reach MongoDB.
  networks: [mongo]
  mem_limit: 384m
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
    start_interval: 2s

x-storage-node: &storage-node
  image: emergency/storage-node:${IMAGE_TAG:-local}
  networks: [mongo, storage]
  mem_limit: 64m
  # "no", so that a node stopped for the failure demo stays down until started again.
  restart: "no"
  healthcheck:
    # Distroless has no curl, so the binary probes its own /readyz.
    test: ["CMD", "/storage-node", "-healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
    start_interval: 2s

x-storage-env: &storage-env
  SERVER_PORT: "8080"
  MONGO_DB: storage
  COORDINATOR_URL: http://coordinator:8080
  HEARTBEAT_INTERVAL: 5s
  # Tell the Go garbage collector about the container limit so it collects before
  # the kernel OOM-kills the process (Go does not read cgroup memory limits itself).
  GOMEMLIMIT: 48MiB

services:
  coordinator:
    image: emergency/coordinator:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
      SHARD_COUNT: "3"
      STORAGE_TIMEOUT: 3s
      HEARTBEAT_TIMEOUT: 15s
      ELECTION_WINDOW: 10s
      GOMEMLIMIT: 48MiB
    networks: [storage, services]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      # /readyz: healthy once every shard has a primary, so services that depend on
      # the coordinator start only once storage actually works.
      test: ["CMD", "/coordinator", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # ---- application tier --------------------------------------------------------------

  gateway:
    # The single entry point (spec §7.1 F): path-based routing to the services. Replaced
    # by the Kubernetes Gateway API in CP2.
    image: nginx:1.29-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    networks: [services]
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      request-service: { condition: service_healthy }
      resource-service: { condition: service_healthy }
      matching-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 2s

  request-service:
    image: emergency/request-service:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
      COORDINATOR_URL: http://coordinator:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-emergency}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-emergency}
      GEOHASH_PRECISION: "6"
    networks: [services]
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      coordinator: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # Readiness: RabbitMQ and the coordinator reachable (the image has curl).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  resource-service:
    image: emergency/resource-service:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
      COORDINATOR_URL: http://coordinator:8080
      # Must equal the Request Service's, or matching compares different cells.
      GEOHASH_PRECISION: "6"
    networks: [services]
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      coordinator: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  matching-service:
    image: emergency/matching-service:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
      COORDINATOR_URL: http://coordinator:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-emergency}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-emergency}
      # Rematch sweeper: how often waiting requests (UNMATCHED, or PENDING for over
      # REMATCH_PENDING_AGE) are put back on the matching queue. Override in .env.
      REMATCH_INTERVAL: ${REMATCH_INTERVAL:-2m}
      REMATCH_PENDING_AGE: ${REMATCH_PENDING_AGE:-2m}
    networks: [services]
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      coordinator: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # Ready = RabbitMQ (its queue is declared) and the coordinator reachable.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  rabbitmq:
    image: rabbitmq:4.1-management
    # A fixed hostname: RabbitMQ names its data directory after it, so the volume (and
    # the persistent messages in it) survives the container being recreated.
    hostname: rabbitmq
    environment:
      # Credentials come from deploy/compose/.env (git-ignored; copy .env.example).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-emergency}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-emergency}
    volumes: [rabbitmq:/var/lib/rabbitmq]
    networks: [services]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # ---- storage tier --------------------------------------------------------------------

  storage-0-a:
    <<: *storage-node
    environment:
      <<: *storage-env
      NODE_ID: storage-0-a
      SHARD_ID: "0"
      ADVERTISE_URL: http://storage-0-a:8080
      MONGO_URI: mongodb://mongo-0-a:27017
    depends_on:
      mongo-0-a: { condition: service_healthy }
      coordinator: { condition: service_started }

  storage-0-b:
    <<: *storage-node
    environment:
      <<: *storage-env
      NODE_ID: storage-0-b
      SHARD_ID: "0"
      ADVERTISE_URL: http://storage-0-b:8080
      MONGO_URI: mongodb://mongo-0-b:27017
    depends_on:
      mongo-0-b: { condition: service_healthy }
      coordinator: { condition: service_started }

  storage-1-a:
    <<: *storage-node
    environment:
      <<: *storage-env
      NODE_ID: storage-1-a
      SHARD_ID: "1"
      ADVERTISE_URL: http://storage-1-a:8080
      MONGO_URI: mongodb://mongo-1-a:27017
    depends_on:
      mongo-1-a: { condition: service_healthy }
      coordinator: { condition: service_started }

  storage-1-b:
    <<: *storage-node
    environment:
      <<: *storage-env
      NODE_ID: storage-1-b
      SHARD_ID: "1"
      ADVERTISE_URL: http://storage-1-b:8080
      MONGO_URI: mongodb://mongo-1-b:27017
    depends_on:
      mongo-1-b: { condition: service_healthy }
      coordinator: { condition: service_started }

  storage-2-a:
    <<: *storage-node
    environment:
      <<: *storage-env
      NODE_ID: storage-2-a
      SHARD_ID: "2"
      ADVERTISE_URL: http://storage-2-a:8080
      MONGO_URI: mongodb://mongo-2-a:27017
    depends_on:
      mongo-2-a: { condition: service_healthy }
      coordinator: { condition: service_started }

  storage-2-b:
    <<: *storage-node
    environment:
      <<: *storage-env
      NODE_ID: storage-2-b
      SHARD_ID: "2"
      ADVERTISE_URL: http://storage-2-b:8080
      MONGO_URI: mongodb://mongo-2-b:27017
    depends_on:
      mongo-2-b: { condition: service_healthy }
      coordinator: { condition: service_started }

  mongo-0-a:
    <<: *mongo
    volumes: [mongo-0-a:/data/db]

  mongo-0-b:
    <<: *mongo
    volumes: [mongo-0-b:/data/db]

  mongo-1-a:
    <<: *mongo
    volumes: [mongo-1-a:/data/db]

  mongo-1-b:
    <<: *mongo
    volumes: [mongo-1-b:/data/db]

  mongo-2-a:
    <<: *mongo
    volumes: [mongo-2-a:/data/db]

  mongo-2-b:
    <<: *mongo
    volumes: [mongo-2-b:/data/db]

networks:
  # MongoDB instances + storage nodes only. "internal" = no route to the outside world.
  mongo:
    internal: true
  # Storage nodes + coordinator.
  storage: {}
  # Gateway, application services, RabbitMQ and the coordinator (its only door into storage).
  services: {}

volumes:
  rabbitmq: {}
  mongo-0-a: {}
  mongo-0-b: {}
  mongo-1-a: {}
  mongo-1-b: {}
  mongo-2-a: {}
  mongo-2-b: {}
