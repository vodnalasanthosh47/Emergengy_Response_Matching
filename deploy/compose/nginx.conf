# Local gateway (spec §7.1 F): the single entry point on http://localhost:8080, routing
# by path to the services. It mirrors the Gateway API HTTPRoutes that replace it in CP2.
# Each service adds its own location block here:
#     /requests  → request-service   (this branch)
#     /resources → resource-service  (resource branch)
#     /match     → matching-service  (matching branch)

events {}

http {
    # Docker's embedded DNS, re-resolved every 10 s: a restarted container gets a new
    # IP, and nginx would otherwise keep sending to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # /requests and /requests/... (not /requestsXYZ)
        location ~ ^/requests(/|$) {
            set $upstream http://request-service:8080;   # a variable makes nginx use the resolver
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # The service is down or restarting: answer with the standard error JSON (spec §4.1)
        # instead of nginx's HTML page. The services' own error responses pass through as-is.
        error_page 502 503 504 = @unavailable;
        location @unavailable {
            default_type application/json;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"service unavailable, retry later","timestamp":"$time_iso8601"}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"no such endpoint","timestamp":"$time_iso8601"}';
        }
    }
}
