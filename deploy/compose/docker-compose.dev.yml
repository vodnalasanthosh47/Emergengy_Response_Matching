# Development-only override: publishes the coordinator on 127.0.0.1:9090 (call the
# storage tier directly with curl or the storage tests) and the RabbitMQ management UI
# on 127.0.0.1:15672.
#
#   make up-dev            (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
#
# Not part of the CP1 runtime: there, the nginx gateway is the only published port and
# the coordinator is reachable only from inside the Compose network. Bound to 127.0.0.1
# so it is never exposed to other machines on your network.
services:
  coordinator:
    ports:
      - "127.0.0.1:9090:8080"
  rabbitmq:
    # Management UI and HTTP API (queues, messages) for debugging and the demo.
    ports:
      - "127.0.0.1:15672:15672"
