# The coordinator: single entry point to storage. One replica, because its node
# registry is in-memory soft state (ADR 0002); Kubernetes restarts it on failure and
# the nodes re-register within one heartbeat.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: emergency
  labels: { app.kubernetes.io/name: coordinator, app.kubernetes.io/part-of: emergency }
spec:
  replicas: 1
  strategy: { type: Recreate } # never two registries at once
  selector:
    matchLabels: { app.kubernetes.io/name: coordinator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: coordinator, app.kubernetes.io/part-of: emergency }
    spec:
      containers:
        - name: coordinator
          image: emergency/coordinator:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: SHARD_COUNT, value: "3" }
            - { name: STORAGE_TIMEOUT, value: 3s }
            - { name: HEARTBEAT_TIMEOUT, value: 15s }
            - { name: ELECTION_WINDOW, value: 10s }
            - { name: GOMEMLIMIT, value: 48MiB }
          readinessProbe: # ready = every shard has a primary
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: emergency
  labels: { app.kubernetes.io/name: coordinator }
spec:
  selector: { app.kubernetes.io/name: coordinator }
  ports: [{ name: http, port: 8080, targetPort: http }]
  # Storage nodes must be able to register while the coordinator is still "not
  # ready" (it only becomes ready once they have registered).
  publishNotReadyAddresses: true
