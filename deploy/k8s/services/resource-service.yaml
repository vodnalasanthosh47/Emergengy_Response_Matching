# Resource Service: stateless, so a Deployment with several identical pods (spec §2.1,
# PDF §9.2). The Service load-balances over the pods that are ready; the gateway's
# HTTPRoute for /resources points at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: emergency
  labels: { app.kubernetes.io/name: resource-service, app.kubernetes.io/part-of: emergency }
spec:
  replicas: 2
  # Roll out one new pod at a time and remove an old one only once the new one is
  # ready, so the service never drops below 2 ready pods during an update.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: resource-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: resource-service, app.kubernetes.io/part-of: emergency }
    spec:
      # No RABBITMQ_PORT=tcp://... style variables from other Services.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: resource-service
          image: emergency/resource-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: services-config } }]
          # Spring Boot's probe endpoints (management.endpoint.health.probes).
          # startup: give the JVM up to 3 minutes before liveness counts.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          # ready = the coordinator reachable; not ready → no traffic.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          # alive = the JVM answers; dead → Kubernetes restarts the container. It does
          # not include storage, so a storage outage does not restart pods.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # On shutdown, keep serving for a few seconds while the gateway and the
          # Service stop sending new requests to this pod.
          lifecycle:
            preStop: { sleep: { seconds: 5 } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi } # the heap is 75% of this (Dockerfile)
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: emergency
  labels: { app.kubernetes.io/name: resource-service }
spec:
  selector: { app.kubernetes.io/name: resource-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
