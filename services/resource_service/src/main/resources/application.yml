server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: resource-service
  jackson:
    deserialization:
      # A typo in a field name must be an error, not silently ignored.
      fail-on-unknown-properties: true

emergency:
  coordinator-url: ${COORDINATOR_URL:http://localhost:9090}
  storage-timeout: ${STORAGE_TIMEOUT:10s}
  geohash-precision: ${GEOHASH_PRECISION:6}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,storage
  metrics:
    tags:
      application: resource-service
